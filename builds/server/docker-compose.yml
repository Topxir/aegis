services:
  aegis-server:
    image: ghcr.io/aegis-project/aegis-server:0.2.0
    container_name: aegis-server
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "none"
    command: ["--bind", "0.0.0.0", "--port", "8443", "--data-dir", "/var/lib/aegis"]
    ports:
      - "8443:8443/tcp"
    volumes:
      - aegis_data:/var/lib/aegis
volumes:
  aegis_data:
