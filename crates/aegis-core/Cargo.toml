[package]
name = "aegis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aegis protocol v2: envelopes, sealed frames, group frames, vault, proof of work and client transport"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
native-tls = "0.2"
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[lints]
workspace = true
