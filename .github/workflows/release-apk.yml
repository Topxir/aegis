name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aegis-ui-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: target/release/aegis-desktop.exe

  android:
    name: Android APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: apps/aegis-android
        run: ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-android
          path: apps/aegis-android/app/build/outputs/apk/release/*.apk
