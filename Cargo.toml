[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-ui-desktop",
]
exclude = ["apps", "builds", "crates/aegis-server"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["aegis-project <aegis-project@users.noreply.github.com>"]
repository = "https://github.com/aegis-project/aegis"

[workspace.dependencies]
aegis-core = { path = "crates/aegis-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
